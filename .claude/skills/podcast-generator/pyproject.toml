[project]
name = "research-podcast"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "openai>=2.33.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
